<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Assessment Portal</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; margin: 0; padding: 20px; }
    .card { background: white; max-width: 650px; margin: 30px auto; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
    .hidden { display: none; }
    .btn { background: #0066cc; color: white; border: none; padding: 10px 18px; border-radius: 4px; cursor: pointer; font-size: 15px; }
    .btn:hover { background: #0052a3; }
    .btn-danger { background: #d32f2f; }
    .input-field { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .warning { color: #d32f2f; font-weight: bold; margin: 10px 0; }
    .question-block { margin-bottom: 20px; border-bottom: 1px solid #eee; padding-bottom: 15px; }
    #timer { font-size: 20px; font-weight: bold; color: #d32f2f; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="authView" class="card">
    <h2>Secure Mock Test Portal</h2>
    <div id="authForm">
      <input type="text" id="username" class="input-field" placeholder="Username" required />
      <input type="password" id="password" class="input-field" placeholder="Password" required />
      <div style="margin-top: 10px;">
        <button class="btn" onclick="login()">Login</button>
        <button class="btn" style="background: #4caf50;" onclick="register()">Register</button>
      </div>
    </div>
  </div>

  <!-- Dashboard -->
  <div id="dashboardView" class="card hidden">
    <h2>Welcome, <span id="userDisplay"></span></h2>
    <p>Exam Instructions:</p>
    <ul>
      <li>The assessment requires Fullscreen mode.</li>
      <li>Switching tabs or minimizing the browser triggers violation warnings.</li>
      <li>Submissions after the server-side deadline are rejected.</li>
    </ul>
    <button class="btn" onclick="startTest()">Start Test (Fullscreen)</button>
  </div>

  <!-- Assessment View -->
  <div id="testView" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h3 id="testTitle">Assessment</h3>
      <div id="timer">00:00</div>
    </div>
    <div id="warnings" class="warning"></div>
    <hr/>
    <form id="testForm"></form>
    <button class="btn btn-danger" onclick="submitTest()">Submit Assessment</button>
  </div>

  <!-- Results Screen -->
  <div id="resultView" class="card hidden">
    <h2>Assessment Results</h2>
    <h3 id="scoreDisplay"></h3>
    <div id="reviewContainer"></div>
  </div>

  <script>
    let token = "";
    let testId = "test-101";
    let timerInterval = null;
    let infractionCount = 0;

    async function register() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      alert(data.message || data.error);
    }

    async function login() {
      const u = document.getElementById('username').value;
      const p = document.getElementById('password').value;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p })
      });
      const data = await res.json();
      if (res.ok) {
        token = data.token;
        document.getElementById('userDisplay').innerText = data.username;
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('dashboardView').classList.remove('hidden');
      } else {
        alert(data.error);
      }
    }

    async function startTest() {
      if (document.documentElement.requestFullscreen) {
        await document.documentElement.requestFullscreen().catch(() => {});
      }

      const res = await fetch('/api/test/start', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ testId })
      });

      const data = await res.json();
      if (!res.ok) {
        alert(data.error);
        return;
      }

      document.getElementById('dashboardView').classList.add('hidden');
      document.getElementById('testView').classList.remove('hidden');
      document.getElementById('testTitle').innerText = data.title;

      renderQuestions(data.questions);
      startTimer(data.expiresAt);
      setupProctoring();
    }

    function renderQuestions(questions) {
      const form = document.getElementById('testForm');
      form.innerHTML = "";
      questions.forEach((q, qIndex) => {
        const div = document.createElement('div');
        div.className = "question-block";
        div.innerHTML = `<p><strong>Q${qIndex + 1}: ${q.text}</strong></p>`;
        
        q.options.forEach((opt, oIndex) => {
          div.innerHTML += `
            <label style="display: block; margin: 6px 0;">
              <input type="radio" name="${q.id}" value="${oIndex}"> ${opt}
            </label>
          `;
        });
        form.appendChild(div);
      });
    }

    function setupProctoring() {
      document.addEventListener("visibilitychange", () => {
        if (document.hidden) {
          infractionCount++;
          document.getElementById('warnings').innerText = 
            `Warning: Tab switch or minimization detected! (${infractionCount}/3)`;
          if (infractionCount >= 3) {
            alert("Maximum infractions reached. Auto-submitting test.");
            submitTest();
          }
        }
      });

      document.addEventListener("contextmenu", e => e.preventDefault());
      document.addEventListener("copy", e => e.preventDefault());
    }

    function startTimer(expiresAt) {
      timerInterval = setInterval(() => {
        const remaining = expiresAt - Date.now();
        if (remaining <= 0) {
          clearInterval(timerInterval);
          alert("Time is up! Submitting answers...");
          submitTest();
          return;
        }

        const mins = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((remaining % (1000 * 60)) / 1000);
        document.getElementById('timer').innerText = 
          `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
      }, 1000);
    }

    async function submitTest() {
      clearInterval(timerInterval);

      const form = document.getElementById('testForm');
      const formData = new FormData(form);
      const answers = {};
      for (const [key, value] of formData.entries()) {
        answers[key] = parseInt(value, 10);
      }

      const res = await fetch('/api/test/submit', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`
        },
        body: JSON.stringify({ testId, answers })
      });

      const data = await res.json();
      if (res.ok) {
        if (document.exitFullscreen) document.exitFullscreen().catch(() => {});
        document.getElementById('testView').classList.add('hidden');
        document.getElementById('resultView').classList.remove('hidden');
        document.getElementById('scoreDisplay').innerText = 
          `Score: ${data.score} / ${data.total} (${data.percentage}%)`;
      } else {
        alert(data.error);
      }
    }
  </script>
</body>
</html>
